<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reward Bot</title>

    <!-- Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- AdsGram -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f6f8;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 400px;
            margin: auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        .balance {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
        }

        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #watchAd {
            background: #2196f3;
            color: white;
        }

        #withdraw {
            background: #4caf50;
            color: white;
        }

        .info {
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎁 Reward Bot</h1>

    <div class="balance">
        💰 Balance: <span id="points">0</span> Points
    </div>

    <button id="watchAd">🎬 Watch Ad</button>

    <button id="withdraw">💸 Withdraw</button>

    <div class="info">
        📊 Completed Ads:
        <span id="completedAds">0</span>
    </div>

</div>


<!-- Firebase -->
<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
        getAuth,
        signInAnonymously
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
        getDatabase,
        ref,
        get,
        set,
        update
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    // Firebase configuration
    const firebaseConfig = {

        apiKey: "AIzaSyCeTZZ3cF-rMMa5_SRJwFl5pxNwSg2WtRY",

        authDomain: "reward-bot-10057.firebaseapp.com",

        databaseURL:
        "https://reward-bot-10057-default-rtdb.firebaseio.com",

        projectId: "reward-bot-10057",

        storageBucket:
        "reward-bot-10057.firebasestorage.app",

        messagingSenderId: "597172901235",

        appId:
        "1:597172901235:web:9bc31a396ac2a5063b6106"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getDatabase(app);


    // Telegram Mini App
    const tg = window.Telegram.WebApp;

    tg.ready();


    // AdsGram
    const AdController = window.Adsgram.init({
        blockId: "49902"
    });


    let points = 0;

    let completedAds = 0;

    let userUID = null;


    const watchAdButton =
        document.getElementById("watchAd");

    const pointsText =
        document.getElementById("points");

    const completedAdsText =
        document.getElementById("completedAds");


    /*
     * Firebase Anonymous Login
     */

    signInAnonymously(auth)

        .then(async (userCredential) => {

            userUID = userCredential.user.uid;

            console.log("Firebase UID:", userUID);


            // Load user's existing data
            const userRef =
                ref(db, "users/" + userUID);

            const snapshot =
                await get(userRef);


            if (snapshot.exists()) {

                const data = snapshot.val();

                points = data.points || 0;

                completedAds =
                    data.completedAds || 0;

            } else {

                // First-time user
                points = 0;

                completedAds = 0;

                await set(userRef, {

                    points: 0,

                    completedAds: 0

                });

            }


            // Update screen
            pointsText.innerText = points;

            completedAdsText.innerText =
                completedAds;

        })

        .catch((error) => {

            console.error(
                "Firebase Authentication Error:",
                error
            );

            alert(
                "Firebase login failed. Please try again."
            );

        });


    /*
     * Watch Ad
     */

    watchAdButton.addEventListener(
        "click",
        function () {

            if (!userUID) {

                alert(
                    "Please wait. Connecting..."
                );

                return;
            }


            watchAdButton.disabled = true;

            watchAdButton.innerText =
                "⏳ Loading Ad...";


            AdController.show()

                .then(async () => {

                    /*
                     * Reward only after successful
                     * rewarded ad completion.
                     */

                    points += 1;

                    completedAds += 1;


                    // Update screen
                    pointsText.innerText =
                        points;

                    completedAdsText.innerText =
                        completedAds;


                    // Save to Firebase
                    const userRef =
                        ref(db, "users/" + userUID);


                    await update(userRef, {

                        points: points,

                        completedAds:
                            completedAds

                    });


                    alert(
                        "🎉 Ad completed!\n+1 Point"
                    );


                    watchAdButton.disabled =
                        false;

                    watchAdButton.innerText =
                        "🎬 Watch Ad";

                })


                .catch((error) => {

                    console.log(
                        "AdsGram error:",
                        error
                    );


                    alert(
                        "❌ Ad could not be shown. Please try again."
                    );


                    watchAdButton.disabled =
                        false;

                    watchAdButton.innerText =
                        "🎬 Watch Ad";

                });

        }
    );


    /*
     * Withdraw
     */

    document.getElementById("withdraw")
        .addEventListener(
            "click",
            function () {

                alert(
                    "💸 Withdrawal feature will be available soon."
                );

            }
        );

</script>

</body>
</html>
