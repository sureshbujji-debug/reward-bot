<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward Bot</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f6f8;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 400px;
            margin: auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        .balance {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
        }

        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #watchAd {
            background: #2196f3;
            color: white;
        }

        #withdraw {
            background: #4caf50;
            color: white;
        }

        .info {
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎁 Reward Bot</h1>

    <div class="balance">
        💰 Balance: <span id="points">0</span> Points
    </div>

    <button id="watchAd">🎬 Watch Ad</button>

    <button id="withdraw">💸 Withdraw</button>

    <div class="info">
        📊 Completed Ads: <span id="completedAds">0</span>
    </div>

</div>

<script>

    // Telegram Mini App
    const tg = window.Telegram.WebApp;
    tg.ready();

    // AdsGram Block ID
    const AdController = window.Adsgram.init({
        blockId: "49902"
    });

    let points = 0;
    let completedAds = 0;

    const watchAdButton = document.getElementById("watchAd");
    const pointsText = document.getElementById("points");
    const completedAdsText = document.getElementById("completedAds");

    watchAdButton.addEventListener("click", function () {

        watchAdButton.disabled = true;
        watchAdButton.innerText = "⏳ Loading Ad...";

        AdController.show()
            .then((result) => {

                // Reward only after successful rewarded ad completion
                points += 1;
                completedAds += 1;

                pointsText.innerText = points;
                completedAdsText.innerText = completedAds;

                alert("🎉 Ad completed!\n+1 Point");

                watchAdButton.disabled = false;
                watchAdButton.innerText = "🎬 Watch Ad";

            })
            .catch((result) => {

                console.log("AdsGram error:", result);

                alert("❌ Ad could not be shown. Please try again.");

                watchAdButton.disabled = false;
                watchAdButton.innerText = "🎬 Watch Ad";

            });

    });

    document.getElementById("withdraw").addEventListener("click", function () {

        alert("💸 Withdrawal feature will be available soon.");

    });

</script>

</body>
</html>
